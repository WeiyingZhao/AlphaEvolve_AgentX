task_id: code_gen_palindrome
name: Palindrome Checker
category: code_generation
difficulty: easy
description: Check if a string is a palindrome (ignoring case/spaces).
detailed_instructions: Implement `is_palindrome(s)` which returns True if string s is a palindrome, considering only alphanumeric characters and ignoring case.
starter_code:
  solution.py: "def is_palindrome(s):\n    # TODO\n    pass"
reference_solution:
  solution.py: "import re\ndef is_palindrome(s):\n    cleaned = ''.join(c.lower() for c in s if c.isalnum())\n    return cleaned == cleaned[::-1]"
public_tests:
- test_id: cg1_public
  name: Simple Palindrome
  input_data:
    function: is_palindrome
    args:
    - Racecar
  expected_output: true
  weight: 1.0
hidden_tests:
- test_id: cg1_hidden
  name: Complex Palindrome
  input_data:
    function: is_palindrome
    args:
    - 'A man, a plan, a canal: Panama'
  expected_output: true
  weight: 1.5
  is_hidden: true
- test_id: cg1_hidden_fail
  name: Not Palindrome
  input_data:
    function: is_palindrome
    args:
    - hello
  expected_output: false
  weight: 1.0
  is_hidden: true
evaluation_criteria:
- Correctness
- Handles non-alphanumeric chars
max_score: 100.0
time_limit_seconds: 30
allowed_languages:
- python
tags:
- strings
- algorithms
