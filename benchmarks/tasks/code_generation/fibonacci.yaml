description: |
  Implement a function `fibonacci(n)` that returns the nth Fibonacci number.
  The Fibonacci sequence starts with 0, 1, and each subsequent number is the
  sum of the two preceding ones: 0, 1, 1, 2, 3, 5, 8, 13, 21, ...

detailed_instructions: |
  Write a Python function called `fibonacci` that:
  1. Takes a single integer argument `n` (0-indexed)
  2. Returns the nth Fibonacci number
  3. Handles edge cases: n=0 should return 0, n=1 should return 1
  4. Should work efficiently for n up to at least 40

  Example:
  - fibonacci(0) -> 0
  - fibonacci(1) -> 1
  - fibonacci(10) -> 55

