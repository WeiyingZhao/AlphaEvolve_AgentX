detailed_instructions: |
  Write a Python function called `two_sum` that:
  1. Takes a list of integers `nums` and an integer `target`
  2. Returns a list of two indices [i, j] where nums[i] + nums[j] == target
  3. You may assume each input has exactly one solution
  4. You may not use the same element twice
  5. The returned indices can be in any order

  Example:
  - two_sum([2, 7, 11, 15], 9) -> [0, 1] (because nums[0] + nums[1] = 2 + 7 = 9)

