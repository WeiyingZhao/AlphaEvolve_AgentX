task_id: code_gen_prime_factors
name: Prime Factorization
category: code_generation
difficulty: medium
description: Return a list of prime factors for a given integer.
detailed_instructions: Implement `get_prime_factors(n)` that returns a sorted list of prime factors of n. If n < 2, return [].
starter_code:
  solution.py: "def get_prime_factors(n):\n    # TODO\n    pass"
reference_solution:
  solution.py: "def get_prime_factors(n):\n    factors = []\n    d = 2\n    temp = n\n    while d * d <= temp:\n        while temp % d == 0:\n            factors.append(d)\n            temp //= d\n        d += 1\n    if temp > 1:\n        factors.append(temp)\n    return factors"
public_tests:
- test_id: cg2_public
  name: Factors of 12
  input_data:
    function: get_prime_factors
    args:
    - 12
  expected_output:
  - 2
  - 2
  - 3
  weight: 1.0
hidden_tests:
- test_id: cg2_hidden
  name: Large Prime
  input_data:
    function: get_prime_factors
    args:
    - 97
  expected_output:
  - 97
  weight: 1.0
  is_hidden: true
- test_id: cg2_hidden_2
  name: Composite
  input_data:
    function: get_prime_factors
    args:
    - 100
  expected_output:
  - 2
  - 2
  - 5
  - 5
  weight: 1.0
  is_hidden: true
evaluation_criteria:
- Correctness
- Efficiency
max_score: 100.0
time_limit_seconds: 30
allowed_languages:
- python
tags:
