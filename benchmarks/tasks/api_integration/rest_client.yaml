reference_solution:
  solution.py: |
    """Reference implementation of REST API client."""
    import time
    from typing import Dict, Any, Tuple, Optional, List


    class APIError(Exception):
        def __init__(self, status_code: int, message: str):
            self.status_code = status_code
            self.message = message
            super().__init__(f"API Error {status_code}: {message}")


    class APIClient:
        def __init__(
            self,
            base_url: str,
            api_key: str,
            timeout: int = 30,
            max_retries: int = 3,
        ):
            self.base_url = base_url.rstrip('/')
            self.api_key = api_key
            self.timeout = timeout
            self.max_retries = max_retries

        def _get_headers(self) -> Dict[str, str]:
            return {
                "Authorization": f"Bearer {self.api_key}",
                "Content-Type": "application/json",
                "Accept": "application/json",
            }

        def _handle_response(self, response) -> Tuple[bool, Dict, str]:
            if 200 <= response.status_code < 300:
                return True, response.json(), ""
            return False, {}, f"HTTP {response.status_code}: {response.json().get('error', 'Unknown error')}"

        def _should_retry(self, status_code: int, attempt: int) -> bool:
            if attempt >= self.max_retries:
                return False
            return status_code in (429, 500, 502, 503, 504)

        def _make_request(self, method: str, endpoint: str, **kwargs) -> Tuple[bool, Dict, str]:
            url = f"{self.base_url}/{endpoint.lstrip('/')}"
            headers = self._get_headers()

            for attempt in range(self.max_retries + 1):
                try:
                    response = mock_request(method, url, headers=headers, **kwargs)

                    if response.status_code == 429:
                        retry_after = int(response.headers.get("Retry-After", 1))
                        time.sleep(min(retry_after, 5))
                        continue

                    if self._should_retry(response.status_code, attempt):
                        time.sleep(2 ** attempt * 0.1)
                        continue

                    return self._handle_response(response)

                except Exception as e:
                    if attempt == self.max_retries:
                        return False, {}, str(e)
                    time.sleep(2 ** attempt * 0.1)

            return False, {}, "Max retries exceeded"

        def get(self, endpoint: str, params: Optional[Dict] = None) -> Tuple[bool, Dict, str]:
            return self._make_request("GET", endpoint, params=params or {})

        def post(self, endpoint: str, data: Dict) -> Tuple[bool, Dict, str]:
            return self._make_request("POST", endpoint, json=data)

        def put(self, endpoint: str, data: Dict) -> Tuple[bool, Dict, str]:
            return self._make_request("PUT", endpoint, json=data)

        def delete(self, endpoint: str) -> Tuple[bool, Dict, str]:
            return self._make_request("DELETE", endpoint)

        def get_paginated(self, endpoint: str, max_pages: int = 10) -> Tuple[bool, List[Dict], str]:
            all_data = []
            current_page = 1

            while current_page <= max_pages:
                success, data, error = self.get(endpoint, params={"page": current_page})

                if not success:
                    return False, all_data, error

                all_data.extend(data.get("data", []))

                if not data.get("next"):
                    break

                current_page += 1

            return True, all_data, ""


    class MockResponse:
        def __init__(self, status_code: int, json_data: Dict, headers: Dict = None):
            self.status_code = status_code
            self._json = json_data
            self.headers = headers or {}

        def json(self):
            return self._json


    def mock_request(method: str, url: str, **kwargs) -> MockResponse:
        if "error500" in url:
            return MockResponse(500, {"error": "Internal Server Error"})
        if "error429" in url:
            return MockResponse(429, {"error": "Rate Limited"}, {"Retry-After": "1"})
        if "unauthorized" in url:
            return MockResponse(401, {"error": "Unauthorized"})
        if "paginated" in url:
            page = kwargs.get("params", {}).get("page", 1)
            if page < 3:
                return MockResponse(200, {"data": [{"id": page}], "next": f"{url}?page={page + 1}"})
            return MockResponse(200, {"data": [{"id": page}], "next": None})
        return MockResponse(200, {"data": "success", "id": 1})

