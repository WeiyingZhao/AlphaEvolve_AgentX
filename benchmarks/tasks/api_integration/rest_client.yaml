# Task: Build a REST API Client with Error Handling
# Category: API Integration
# Difficulty: Medium-Hard

task_id: "api_rest_client"
name: "Robust REST API Client"
category: "api_integration"
difficulty: "medium"
description: |
  Implement a robust REST API client that handles authentication, pagination,
  rate limiting, and error recovery. This task tests the ability to work with
  external APIs and handle real-world integration challenges.

detailed_instructions: |
  Build a REST API client class that:

  1. AUTHENTICATION
  - Support API key authentication via headers
  - Handle token refresh when authentication fails

  2. REQUEST HANDLING
  - Implement GET, POST, PUT, DELETE methods
  - Handle pagination (follow 'next' links)
  - Implement retry logic with exponential backoff

  3. ERROR HANDLING
  - Handle HTTP errors (4xx, 5xx) gracefully
  - Implement timeout handling
  - Return structured error responses

  4. RATE LIMITING
  - Respect rate limit headers (X-RateLimit-Remaining)
  - Wait when rate limited (429 status)

  Your APIClient class should:
  - Accept base_url and api_key in constructor
  - Have methods: get(), post(), put(), delete(), get_paginated()
  - Return (success: bool, data: dict, error: str) tuples

