public_tests:
  - test_id: "submission_format"
    name: "Check Submission Format"
    input_data:
      code: |
        import pandas as pd
        import os
        if not os.path.exists('submission.csv'):
            print('FAIL: submission.csv not found')
        else:
            df = pd.read_csv('submission.csv')
            if list(df.columns) == ['PassengerId', 'Survived']:
                print('PASS')
            else:
                print('FAIL: Incorrect columns')
    expected_output: "PASS"
