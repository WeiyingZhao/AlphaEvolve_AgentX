reference_solution:
  solution.py: |
    """Reference implementation of the data pipeline."""
    import json
    import csv
    import os
    from pathlib import Path
    from typing import Dict, List, Any
    from collections import defaultdict


    class DataPipeline:
        def __init__(self, data_dir: str = "data", output_dir: str = "output"):
            self.data_dir = Path(data_dir)
            self.output_dir = Path(output_dir)
            self.customers: List[Dict] = []
            self.orders: List[Dict] = []
            self.results: Dict[str, Any] = {}

        def run(self) -> bool:
            print("Starting pipeline...")
            stages = [
                ("Stage 1: Data Ingestion", self.stage_1_ingest),
                ("Stage 2: Transformation", self.stage_2_transform),
                ("Stage 3: Validation", self.stage_3_validate),
                ("Stage 4: Output", self.stage_4_output),
            ]

            for name, stage_func in stages:
                print(f"Executing {name}...")
                if not stage_func():
                    print(f"ERROR: {name} failed!")
                    return False
                print(f"{name} completed successfully.")

            return True

        def stage_1_ingest(self) -> bool:
            try:
                # Load customers
                with open(self.data_dir / "customers.csv") as f:
                    reader = csv.DictReader(f)
                    self.customers = list(reader)

                # Load orders
                with open(self.data_dir / "orders.json") as f:
                    self.orders = json.load(f)

                return len(self.customers) > 0 and len(self.orders) > 0
            except Exception as e:
                print(f"Ingestion error: {e}")
                return False

        def stage_2_transform(self) -> bool:
            try:
                customer_spend = defaultdict(lambda: {"total": 0, "count": 0})

                for order in self.orders:
                    cid = order["customer_id"]
                    customer_spend[cid]["total"] += float(order["amount"])
                    customer_spend[cid]["count"] += 1

                self.results = {}
                for customer in self.customers:
                    cid = customer["customer_id"]
                    spend_info = customer_spend[cid]
                    total = spend_info["total"]

                    if total < 100:
                        category = "bronze"
                    elif total <= 500:
                        category = "silver"
                    else:
                        category = "gold"

                    self.results[cid] = {
                        **customer,
                        "total_spend": total,
                        "category": category,
                        "order_count": spend_info["count"],
                    }

                return True
            except Exception as e:
                print(f"Transform error: {e}")
                return False

        def stage_3_validate(self) -> bool:
            try:
                for cid, data in self.results.items():
                    if not cid:
                        return False
                    if data["total_spend"] < 0:
                        return False
                return True
            except Exception as e:
                print(f"Validation error: {e}")
                return False

        def stage_4_output(self) -> bool:
            try:
                self.output_dir.mkdir(parents=True, exist_ok=True)

                # CSV output
                with open(self.output_dir / "customer_summary.csv", "w", newline="") as f:
                    writer = csv.DictWriter(f, fieldnames=[
                        "customer_id", "name", "email", "total_spend", "category", "order_count"
                    ])
                    writer.writeheader()
                    for cid, data in self.results.items():
                        writer.writerow({
                            "customer_id": cid,
                            "name": data["name"],
                            "email": data["email"],
                            "total_spend": data["total_spend"],
                            "category": data["category"],
                            "order_count": data["order_count"],
                        })

                # JSON report
                categories = defaultdict(int)
                for data in self.results.values():
                    categories[data["category"]] += 1

                report = {
                    "total_customers": len(self.results),
                    "total_orders": len(self.orders),
                    "total_revenue": sum(d["total_spend"] for d in self.results.values()),
                    "category_breakdown": dict(categories),
                    "validation_passed": True,
                }

                with open(self.output_dir / "pipeline_report.json", "w") as f:
                    json.dump(report, f, indent=2)

                return True
            except Exception as e:
                print(f"Output error: {e}")
                return False


    if __name__ == "__main__":
        pipeline = DataPipeline()
        success = pipeline.run()
        print(f"Pipeline completed: {'SUCCESS' if success else 'FAILED'}")

