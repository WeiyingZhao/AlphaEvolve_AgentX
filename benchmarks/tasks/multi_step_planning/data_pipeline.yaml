# Task: Build a Data Processing Pipeline
# Category: Multi-Step Planning
# Difficulty: Hard

task_id: "multi_step_data_pipeline"
name: "Multi-Step Data Processing Pipeline"
category: "multi_step_planning"
difficulty: "hard"
description: |
  Design and implement a complete data processing pipeline that reads data from
  multiple sources, performs transformations, validates results, and outputs
  processed data. This task requires planning, decomposition, and sequential
  execution across multiple stages.

detailed_instructions: |
  You need to build a data pipeline with the following stages:

  STAGE 1: Data Ingestion
  - Read customer data from `data/customers.csv`
  - Read order data from `data/orders.json`
  - Validate that both files exist and have expected schemas

  STAGE 2: Data Transformation
  - Join customers with their orders
  - Calculate total spend per customer
  - Categorize customers: bronze (<$100), silver ($100-500), gold (>$500)

  STAGE 3: Data Validation
  - Ensure no null customer IDs
  - Verify all order amounts are positive
  - Check referential integrity (all orders have valid customers)

  STAGE 4: Output Generation
  - Generate `output/customer_summary.csv` with columns:
    [customer_id, name, email, total_spend, category, order_count]
  - Generate `output/pipeline_report.json` with:
    {
      "total_customers": N,
      "total_orders": N,
      "total_revenue": N,
      "category_breakdown": {...},
      "validation_passed": true/false
    }

  Your solution must:
  - Handle errors gracefully at each stage
  - Log progress to stdout
  - Complete within the time limit

