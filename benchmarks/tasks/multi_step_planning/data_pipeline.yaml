hidden_tests:
  - test_id: "csv_content_valid"
    name: "CSV contains correct data"
    input_data:
      code: |
        import csv
        with open("output/customer_summary.csv") as f:
            reader = csv.DictReader(f)
            rows = list(reader)

        # Check row count
        if len(rows) != 5:
            print(f"FAIL: Expected 5 rows, got {len(rows)}")
        else:
            # Check C004 is gold category
            c004 = next((r for r in rows if r["customer_id"] == "C004"), None)
            if c004 and c004["category"] == "gold":
                print("PASS")
            else:
                print("FAIL: C004 should be gold category")
    expected_output: "PASS"
    weight: 2.5
    is_hidden: true

  - test_id: "json_report_valid"
    name: "JSON report contains correct totals"
    input_data:
      code: |
        import json
        with open("output/pipeline_report.json") as f:
            report = json.load(f)

        if report["total_customers"] == 5 and report["total_orders"] == 8:
            if abs(report["total_revenue"] - 1445.50) < 0.01:
                print("PASS")
            else:
                print(f"FAIL: Wrong revenue {report['total_revenue']}")
        else:
            print(f"FAIL: Wrong counts")
    expected_output: "PASS"
    weight: 3.0
    is_hidden: true

  - test_id: "categories_correct"
    name: "Customer categories are correct"
    input_data:
      code: |
        import json
        with open("output/pipeline_report.json") as f:
            report = json.load(f)

        breakdown = report.get("category_breakdown", {})
        # Expected: bronze=2 (C003, C005), silver=2 (C001, C002), gold=1 (C004)
        if breakdown.get("bronze") == 2 and breakdown.get("silver") == 2 and breakdown.get("gold") == 1:
            print("PASS")
        else:
            print(f"FAIL: Wrong breakdown {breakdown}")
    expected_output: "PASS"
    weight: 2.5
    is_hidden: true

