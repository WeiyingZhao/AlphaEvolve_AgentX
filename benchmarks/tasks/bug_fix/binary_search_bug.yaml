task_id: "bug_fix_binary_search"
name: "Fix Binary Search Bug"
category: "bug_fix"
difficulty: "medium"
description: |
  The provided binary search implementation has bugs that cause it to fail
  for certain inputs. Find and fix all the bugs.

detailed_instructions: |
  The binary_search function should:
  1. Search for a target value in a sorted array
  2. Return the index if found, -1 if not found
  3. Handle empty arrays correctly
  4. Handle arrays with one element
  5. Handle cases where target is not in the array

  The current implementation has multiple bugs. Fix them all.

context_files:
  solution.py: |
    def binary_search(arr, target):
        """
        Search for target in sorted array arr.
        Return index if found, -1 if not found.
        """
        left = 0
        right = len(arr)  # Bug 1: Should be len(arr) - 1

        while left < right:  # Bug 2: Should be left <= right
            mid = (left + right) / 2  # Bug 3: Should use // for integer division

            if arr[mid] == target:
                return mid
            elif arr[mid] < target:
                left = mid  # Bug 4: Should be mid + 1
            else:
                right = mid  # Bug 5: Should be mid - 1

        return -1

reference_solution:
  solution.py: |
    def binary_search(arr, target):
        """
        Search for target in sorted array arr.
        Return index if found, -1 if not found.
        """
        if not arr:
            return -1

        left = 0
        right = len(arr) - 1

        while left <= right:
            mid = (left + right) // 2

            if arr[mid] == target:
                return mid
            elif arr[mid] < target:
                left = mid + 1
            else:
                right = mid - 1

        return -1

