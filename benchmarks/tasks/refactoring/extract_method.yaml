    def process_orders(orders):
        """Process a list of orders and return summary."""
        results = []
        total_revenue = 0
        total_items = 0

        for order in orders:
            # Validate order (repeated pattern)
            if order is None:
                continue
            if 'items' not in order:
                continue
            if 'customer_id' not in order:
                continue
            if len(order['items']) == 0:
                continue

            order_total = 0
            order_items = 0

            for item in order['items']:
                # Validate item (repeated pattern)
                if item is None:
                    continue
                if 'price' not in item:
                    continue
                if 'quantity' not in item:
                    continue
                if item['price'] < 0:
                    continue
                if item['quantity'] < 0:
                    continue

                item_total = item['price'] * item['quantity']
                order_total += item_total
                order_items += item['quantity']

            # Calculate discount (complex logic that should be extracted)
            discount = 0
            if order_total > 1000:
                discount = order_total * 0.20
            elif order_total > 500:
                discount = order_total * 0.10
            elif order_total > 100:
                discount = order_total * 0.05

            final_total = order_total - discount

            results.append({
                'customer_id': order['customer_id'],
                'order_total': order_total,
                'discount': discount,
                'final_total': final_total,
                'item_count': order_items,
            })

            total_revenue += final_total
            total_items += order_items

        return {
            'orders': results,
            'total_revenue': total_revenue,
            'total_items': total_items,
            'order_count': len(results),
        }

reference_solution:
  solution.py: |
    def is_valid_order(order):
        """Validate an order has required fields."""
        if order is None:
            return False
        if 'items' not in order or 'customer_id' not in order:
            return False
        if len(order.get('items', [])) == 0:
            return False
        return True

    def is_valid_item(item):
        """Validate an item has required fields and valid values."""
        if item is None:
            return False
        if 'price' not in item or 'quantity' not in item:
            return False
        if item['price'] < 0 or item['quantity'] < 0:
            return False
        return True

    def calculate_discount(order_total):
        """Calculate discount based on order total."""
        if order_total > 1000:
            return order_total * 0.20
        elif order_total > 500:
            return order_total * 0.10
        elif order_total > 100:
            return order_total * 0.05
        return 0

    def process_order_items(items):
        """Process items in an order and return totals."""
        order_total = 0
        order_items = 0
        for item in items:
            if not is_valid_item(item):
                continue
            item_total = item['price'] * item['quantity']
            order_total += item_total
            order_items += item['quantity']
        return order_total, order_items

    def process_orders(orders):
        """Process a list of orders and return summary."""
        results = []
        total_revenue = 0
        total_items = 0

        for order in orders:
            if not is_valid_order(order):
                continue

            order_total, order_items = process_order_items(order['items'])
            discount = calculate_discount(order_total)
            final_total = order_total - discount

            results.append({
                'customer_id': order['customer_id'],
                'order_total': order_total,
                'discount': discount,
                'final_total': final_total,
                'item_count': order_items,
            })

            total_revenue += final_total
            total_items += order_items

        return {
            'orders': results,
            'total_revenue': total_revenue,
            'total_items': total_items,
            'order_count': len(results),
        }

