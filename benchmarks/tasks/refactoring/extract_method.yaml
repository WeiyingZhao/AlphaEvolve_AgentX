detailed_instructions: |
  The `process_orders` function is too long and has duplicated logic.
  Refactor it to:
  1. Extract repeated validation logic into a separate function
  2. Extract the discount calculation into a separate function
  3. Extract the summary calculation into a separate function
  4. Keep the main function as an orchestrator
  5. Ensure all tests still pass after refactoring

