[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alphaevolve-agentx"
version = "0.1.0"
description = "Green Agent Evaluator for Software Engineering Tasks - A comprehensive benchmark for evaluating AI agents on code generation, debugging, and software engineering challenges"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "AlphaEvolve Team"}
]
keywords = ["agent", "evaluator", "benchmark", "a2a", "software-engineering", "ai"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "httpx>=0.24.0",
    "aiohttp>=3.8.0",
    "pyyaml>=6.0",
    "docker>=6.0.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "rich>=13.0.0",
    "typer>=0.9.0",
    "structlog>=23.0.0",
    "jinja2>=3.1.0",
]

[project.optional-dependencies]
dev = [
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "pre-commit>=3.0.0",
]

[project.scripts]
agentx = "agentx.cli:app"
green-agent = "agentx.green_agent.server:main"
purple-agent = "agentx.purple_agent.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
